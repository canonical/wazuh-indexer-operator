#
name: Automatic doc checks

on:
  push:
    # sync/**: merge commits created while syncing with the upstream fork can conflict in
    # ways that don't trigger CI on a pull_request event alone.
    branches: [ main, "sync/**" ]
  pull_request:
    paths:
      - 'docs/**'             # Only run on changes to the docs directory
      - '!docs/dashboards/**' # Exclude the dashboards subdirectory inside docs
      - 'docs/dashboards/docs/**' # But still include docs inside dashboards

  workflow_dispatch:
    # Manual trigger


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-checks:
    uses: canonical/documentation-workflows/.github/workflows/documentation-checks.yaml@main
    with:
      working-directory: "docs"
      fetch-depth: 0