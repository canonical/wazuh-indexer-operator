#
# Pins hydra and postgresql-k8s to the revision/channel (and, for postgresql-k8s, the exact
# image digest) confirmed to match upstream's opensearch-single-kernel-library test suite (see
# tests/integration/bundle-iam.yaml there), so a future "edge"/"stable" channel update to the
# identity-platform bundle can't silently swap in an untested hydra or postgresql-k8s revision.
applications:
  hydra:
    channel: latest/edge
    revision: 339
  postgresql-k8s:
    channel: 14/stable
    resources:
      postgresql-image: ghcr.io/canonical/charmed-postgresql@sha256:e2283194f7f8d9997fb06f0fd1ab0ec3938ce73ac001133bd8fd393ebe83acc7
